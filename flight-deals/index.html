<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>항공권 땡처리 알리미</title>
    <meta name="description" content="원하는 지역과 기간, 목표 가격을 등록해두고 좋은 가격이 나오면 알림을 받는 개인용 웹앱." />
    <link
      rel="icon"
      href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%230b5cff"/><path d="M12 40l40-16-8 20-10-4-6 8-2-8z" fill="%23ffffff"/></svg>'
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">개인용 · 브라우저 저장</p>
          <h1>항공권 땡처리 알리미</h1>
          <p class="hero-text">
            가고 싶은 지역과 기간, 목표 가격을 미리 등록해두세요.
            좋은 가격이 나오면 딜로 표시하고 알림을 보내드립니다.
          </p>
        </div>
        <div class="hero-meta">
          <div class="meta-block">
            <span class="meta-label">등록한 조건</span>
            <strong id="watch-count">0</strong>
          </div>
          <div class="meta-block">
            <span class="meta-label">현재 딜</span>
            <strong id="deal-count">0</strong>
          </div>
          <div class="meta-block">
            <span class="meta-label">마지막 확인</span>
            <strong id="last-check">-</strong>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="panel form-panel">
          <h2 class="panel-title">조건 등록</h2>
          <form id="watch-form" class="watch-form" autocomplete="off">
            <div class="field">
              <label for="origin">출발지</label>
              <input id="origin" name="origin" type="text" value="서울" placeholder="예: 서울" required />
            </div>
            <div class="field">
              <label for="destination">도착지 / 지역</label>
              <input id="destination" name="destination" type="text" placeholder="예: 도쿄, 방콕, 시드니" required />
              <div id="city-chips" class="city-chips" aria-label="자주 쓰는 도시"></div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="date-from">가는 날</label>
                <input id="date-from" name="dateFrom" type="date" required />
              </div>
              <div class="field">
                <label for="date-to">오는 날</label>
                <input id="date-to" name="dateTo" type="date" required />
              </div>
            </div>
            <div class="field">
              <label for="target-price">목표 가격 (원, 왕복 기준)</label>
              <input id="target-price" name="targetPrice" type="number" min="0" step="10000" placeholder="예: 300000" required />
            </div>
            <div class="field">
              <label for="notify">알림 방식</label>
              <select id="notify" name="notify">
                <option value="browser">브라우저 알림</option>
                <option value="none">화면 표시만</option>
              </select>
            </div>
            <button type="submit" class="primary-btn">조건 등록하기</button>
            <p id="form-hint" class="form-hint"></p>
          </form>

          <div class="check-controls">
            <button id="check-now" type="button" class="secondary-btn">지금 가격 확인</button>
            <label class="auto-toggle">
              <input id="auto-check" type="checkbox" />
              <span>자동 확인 (6시간마다)</span>
            </label>
          </div>
          <p class="mock-note">
            실제 왕복 항공권 가격을 조회합니다(Sky Scrapper). 가는 날·오는 날 왕복 총액 기준입니다.
            무료 플랜은 월 100회 제한이라 자동 확인은 6시간 간격이니 아껴 쓰세요.
          </p>
        </section>

        <section class="panel list-panel">
          <div class="list-header">
            <h2 class="panel-title">등록한 조건</h2>
            <button id="clear-all" type="button" class="ghost-btn">전체 삭제</button>
          </div>
          <div id="watch-list" class="watch-list">
            <p class="empty-state">아직 등록한 조건이 없습니다. 왼쪽에서 첫 조건을 등록해보세요.</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
